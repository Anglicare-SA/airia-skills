version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Adelaide
    groups:
      actions:
        patterns: ["*"]
    labels: [ci, dependencies]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: monthly
      timezone: Australia/Adelaide
    groups:
      ci-tools:
        patterns: ["*"]
    labels: [ci, dependencies]
    commit-message:
      prefix: "ci"
