name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned tools
        run: python -m pip install --require-hashes --no-deps -r .github/requirements-ci.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Validate skills
        env:
          VALIDATION_REPORT: ${{ runner.temp }}/validation.md
        run: python .github/scripts/validate_skills.py

      - name: Keep report for the PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-report
          path: ${{ runner.temp }}/validation.md
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan history
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || '' }}
        run: |
          args=(git --redact --no-banner --exit-code 1)
          if [ -n "$RANGE" ]; then args+=(--log-opts "$RANGE"); fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .

  pr-comment:
    name: PR summary
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validation-report
          path: report
        continue-on-error: true

      - name: Post or update the summary comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VALIDATE: ${{ needs.validate.result }}
          SECRETS: ${{ needs.secrets.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- skills-summary -->';
            const icon = r => ({ success: '✅', failure: '❌' }[r] || '⚪');
            let report = '_No validation report was produced._';
            try { report = fs.readFileSync('report/validation.md', 'utf8'); } catch {}
            const body = [
              marker,
              '| Check | Result |', '|---|---|',
              `| Validate skills | ${icon(process.env.VALIDATE)} ${process.env.VALIDATE} |`,
              `| Secret scan | ${icon(process.env.SECRETS)} ${process.env.SECRETS} |`,
              '', report,
              '', '_Merged skills reach gateway clients from `main` on the next fetch._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
